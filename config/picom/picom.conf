#############################################
# picom - X11 compositor for the WezTerm blur
#
# WezTerm can't blur its own background on X11/XFCE (its blur knobs are
# macOS- and KDE-only), so picom provides the real background blur: the
# desktop showing through the translucent terminal becomes a soft wash
# rather than readable content.
#
# Linked from the Agentic-Workflow repo:
#   config/picom/picom.conf -> ~/.config/picom/picom.conf
#
# NOTE: xfwm4's built-in compositor must be OFF or it fights picom.
# install.sh disables it on XFCE (use_compositing = false).
#############################################

# --- backend ------------------------------------------------------------------
# xrender works everywhere (including VMs without GLX/EGL).
# If you have a real GPU with working GLX, switch to:
#   backend = "glx";  vsync = true;  blur-method = "dual_kawase";  blur-strength = 12;
backend = "xrender";
vsync = false;

# --- blur ---------------------------------------------------------------------
# gaussian blur works with xrender; dual_kawase needs glx.
# blur-size is the kernel radius (larger = blurrier); blur-deviation is sigma.
blur-method = "gaussian";
blur-size = 15;
blur-deviation = 5;
blur-background = true;
blur-background-frame = false;

# Spend blur on real windows, not the wallpaper/panel/docks.
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'xfce4-panel'",
];

# --- transparency -------------------------------------------------------------
# Each app owns its own opacity (WezTerm sets window_background_opacity);
# picom just blurs behind whatever is translucent.
detect-client-opacity = true;

# --- fading (subtle) ----------------------------------------------------------
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
