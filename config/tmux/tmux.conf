# ── Tmux readability config ──
# Part of Agentic-Workflow: https://github.com/zachmarmolejo/Agentic-Workflow
# Catppuccin Mocha palette to match the rose-pine-moon terminal theme.

# True color + better terminal detection
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,*:RGB"

# Larger scrollback
set -g history-limit 50000

# Faster escape (no lag)
set -sg escape-time 0

# Mouse support (scroll, select pane, resize)
set -g mouse on
# Right-click: paste from tmux buffer (keeps default right-click behavior)
bind-key -n MouseDown3Pane paste-buffer -p

# Start window/pane numbers at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Status bar ──
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 40
set -g status-right-length 60
set -g status-left "#[fg=#89b4fa,bold] #S #[fg=#45475a]| "
set -g status-right "#[fg=#a6adc8]%Y-%m-%d #[fg=#89b4fa]%H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#1e1e2e,bg=#89b4fa,bold] #I:#W #[default]"
setw -g window-status-separator ""

# ── Panes ──
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
set -g pane-border-status top
set -g pane-border-format " #{pane_index} #{pane_current_command} "

# ── Copy mode ──
setw -g mode-style "fg=#cdd6f4,bg=#45475a,bold"
set -g @copy_command ""

# ── Keybinds ──
# Reload config
bind r source-file ~/.tmux.conf \; display "tmux config reloaded"
# Split panes: keep default Ctrl+B " and %, add | and - as aliases
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# Switch panes with Alt+arrow
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
# Resize panes with Shift+arrow
bind -n S-Left resize-pane -L 2
bind -n S-Right resize-pane -R 2
bind -n S-Up resize-pane -U 2
bind -n S-Down resize-pane -D 2